<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <title>SutraBot — a small conversation space</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="SutraBot home">
        <span class="brand-mark" aria-hidden="true">सू</span>
        <span><strong>SutraBot</strong><small>Small talk, two languages</small></span>
      </a>
      <label class="language-control" for="language-select">
        <span>Reply language</span>
        <select id="language-select" aria-label="Choose reply language">
          <option value="english">English</option>
          <option value="sanskrit">संस्कृतम्</option>
        </select>
      </label>
    </header>

    <section class="conversation" aria-label="Chat conversation">
      <div class="welcome-note"><span class="status-dot"></span> Ready for a message</div>
      <div class="messages" id="messages" aria-live="polite" aria-relevant="additions">
        <article class="message bot-message">
          <span class="avatar bot-avatar" aria-hidden="true">सू</span>
          <div class="message-content"><span class="speaker">SutraBot</span><p>Namaste! I’m a little rule-based chat companion. Pick a language and say hello.</p></div>
        </article>
      </div>
    </section>

    <section class="composer-area" aria-label="Send a message">
      <p class="prompt-label">A few ways to begin</p>
      <div class="suggestions">
        <button type="button" class="suggestion" data-message="Say hello">Say hello <span>↗</span></button>
        <button type="button" class="suggestion" data-message="Who are you?">Who are you? <span>↗</span></button>
        <button type="button" class="suggestion" data-message="What can you do?">What can you do? <span>↗</span></button>
        <button type="button" class="suggestion" data-message="Help">Help <span>↗</span></button>
      </div>
      <form id="chat-form" class="chat-form">
        <label class="visually-hidden" for="message-input">Your message</label>
        <input id="message-input" name="message" type="text" placeholder="Write a message…" autocomplete="off" maxlength="500" required>
        <button class="send-button" type="submit"><span>Send</span><span aria-hidden="true">↑</span></button>
      </form>
      <div class="footer-line"><span>Responses are generated by simple rules.</span><span>Python <b>·</b> Flask</span></div>
      <p class="error-message" id="error-message" role="alert" hidden></p>
    </section>
  </main>
</body>
</html>
